[project]
name = "analyzer-data"
version = "0.1.0"
description = "Data Analyzer CLI — analisis CSV/log dari terminal"
requires-python = ">=3.10"
dependencies = [
    "typer>=0.12",
    "pandas>=2.0",
    "matplotlib>=3.8",
]

[project.scripts]
analyzer = "analyzer.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["analyzer"]
